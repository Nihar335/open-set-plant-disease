osr_protocol:
  version: 1
  seed: 42
  known_split_fractions:
    train: 0.7
    val: 0.15
    test: 0.15
  known_classes:
  - Apple___Apple_scab
  - Apple___Cedar_apple_rust
  - Apple___healthy
  - Corn_(maize)___Cercospora_leaf_spot Gray_leaf_spot
  - Corn_(maize)___Common_rust_
  - Corn_(maize)___healthy
  - Grape___Black_rot
  - Grape___Leaf_blight_(Isariopsis_Leaf_Spot)
  - Grape___healthy
  - Pepper,_bell___Bacterial_spot
  - Pepper,_bell___healthy
  - Potato___Early_blight
  - Potato___Late_blight
  - Potato___healthy
  - Tomato___Bacterial_spot
  - Tomato___Early_blight
  - Tomato___Late_blight
  - Tomato___Leaf_Mold
  - Tomato___Spider_mites Two-spotted_spider_mite
  - Tomato___Tomato_Yellow_Leaf_Curl_Virus
  - Tomato___healthy
  unknown_near:
    Tomato___Septoria_leaf_spot:
      resembles:
      - Tomato___Bacterial_spot
      - Tomato___Early_blight
      why: small dark circular lesions with pale centres; easily read as bacterial
        spot / early-blight spotting
    Tomato___Target_Spot:
      resembles:
      - Tomato___Early_blight
      why: brown lesions with concentric rings, the hallmark cue of early blight
    Apple___Black_rot:
      resembles:
      - Apple___Apple_scab
      - Apple___Cedar_apple_rust
      why: 'frog-eye leaf spots: dark lesions on an apple leaf, like scab / rust spotting'
    Grape___Esca_(Black_Measles):
      resembles:
      - Grape___Black_rot
      - Grape___Leaf_blight_(Isariopsis_Leaf_Spot)
      why: dark necrotic spotting and interveinal browning on grape leaves
    Corn_(maize)___Northern_Leaf_Blight:
      resembles:
      - Corn_(maize)___Cercospora_leaf_spot Gray_leaf_spot
      why: elongated tan necrotic lesions on a corn blade, like gray leaf spot
  unknown_val:
  - Tomato___Tomato_mosaic_virus
  - Cherry_(including_sour)___Powdery_mildew
  - Cherry_(including_sour)___healthy
  unknown_far_crops:
  - Blueberry
  - Orange
  - Peach
  - Raspberry
  - Soybean
  - Squash
  - Strawberry
  far_balanced_per_class: 300
  dtd_split_file: labels/test1.txt
  plantvillage_exclude:
    data/raw/plantvillage/color/Tomato___Late_blight/cb3bd866-dd84-4f7e-9226-b4a2a2c7f2ae___GH_HL Leaf 173.2.JPG: 'label_error:
      healthy photo code (GH_HL) in a disease folder; SIFT-verified same leaf as a
      Tomato___healthy image'
    data/raw/plantvillage/color/Tomato___Late_blight/d674cbf6-0cdc-407a-97ea-c3f53f2c51e4___GH_HL Leaf 170.JPG: 'label_error:
      healthy photo code (GH_HL) in a disease folder (the only other such file)'
  plantdoc:
    exclude_roles:
    - unknown_val
    drop_label_conflicts: true
    dedupe_strong_duplicates: true
    min_images_for_per_class_metrics: 10
    caveats:
      Corn rust leaf: file names show Southern corn rust mixed in; PlantVillage class
        is Common rust
      Corn leaf blight: file names show Southern corn leaf blight mixed in; both are
        unseen diseases, so the unknown label stays valid
      Tomato two spotted spider mites leaf: only 2 images
same_leaf_verification:
  saturation_min: 30
  lowe_ratio: 0.75
  ransac_px: 5.0
  calibration_pairs: 1500
  negative_min_leaf_gap: 20
  max_false_positive_rate: 0.005
baseline:
  run_name: baseline
  dataset:
    train_manifest: data/splits/train.csv
    val_manifest: data/splits/val.csv
    test_manifest: data/splits/test.csv
    class_mapping: data/splits/class_mapping.yaml
    row_filter:
      role:
      - known
      dataset:
      - plantvillage
  model:
    architecture: resnet50
    pretrained: true
    num_classes: 21
  training:
    image_size: 224
    resize: 256
    batch_size: 64
    num_workers: 6
    seed: 42
    deterministic: true
    amp: true
    optimizer: adamw
    weight_decay: 0.0001
    label_smoothing: 0.0
    class_balancing: weighted_ce
    class_weight_power: 0.5
    phase_a:
      epochs: 3
      learning_rate: 0.001
    phase_b:
      unfreeze:
      - layer3
      - layer4
      max_epochs: 20
      learning_rate: 0.001
      backbone_learning_rate: 0.0001
      scheduler: cosine
      warmup_epochs: 1
    early_stopping:
      monitor: val_macro_f1
      patience: 5
      min_delta: 0.0005
  augmentation:
    random_resized_crop_scale:
    - 0.7
    - 1.0
    random_resized_crop_ratio:
    - 0.9
    - 1.11
    horizontal_flip: true
    vertical_flip: true
    rotation: 15
    rotation_fill:
    - 124
    - 116
    - 104
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.15
      hue: 0.0
  evaluation:
    test_set: full
    strict_test: true
    gradcam_examples: 8
  hardware:
    device: auto
