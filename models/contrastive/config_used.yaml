  seed: 42
probe_diagnostic:
  pairs:
  - - Grape___Esca_(Black_Measles)
    - Grape___Black_rot
  - - Corn_(maize)___Northern_Leaf_Blight
    - Corn_(maize)___Cercospora_leaf_spot Gray_leaf_spot
  controls:
    known_pair:
    - Grape___Black_rot
    - Grape___Leaf_blight_(Isariopsis_Leaf_Spot)
    random_half_class: Grape___Black_rot
  model: logistic_regression
  C: 0.1
  cv: leaf_grouped_stratified_5fold
  repeats: 5
  bootstrap: 1000
contrastive:
  run_name: contrastive
  init: imagenet
  trainable:
  - layer3
  - layer4
  projection:
    hidden: 2048
    out: 128
  temperature: 0.07
  classes_per_batch: 16
  samples_per_class: 4
  views: 2
  epochs: 25
  batches_per_epoch: 298
  optimizer: adamw
  lr_head: 0.001
  lr_backbone: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 1
  amp: true
  num_workers: 6
  seed: 42
  early_stopping:
    monitor: val_nearest_centroid_macro_f1
    patience: 5
    min_delta: 0.0005
  val_reference_per_class: 50
  augmentation: same_as_stage3
  evaluation_representation: backbone_2048_l2_normalised
  linear_head:
    C: 1.0
    max_iter: 3000
  scores:
  - prototype_cosine
  - mahalanobis_normalised
  - msp_linear_head
  - energy_linear_head
  primary_score: prototype_cosine
  comparison_grid: '{original, contrastive} x {prototype_cosine, mahalanobis_normalised},
    same protocol'
  target_known_acceptance: 0.95
  bootstrap_resamples: 1000
