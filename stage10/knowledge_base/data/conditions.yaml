  - MGMT-TARGETSPOT-REMOVE-LOWER-LEAVES
  - MGMT-TARGETSPOT-ROTATION
  - MGMT-TARGETSPOT-WEEDS
  - MGMT-TARGETSPOT-TOLERANT-LINE
  - MGMT-TARGETSPOT-CHEMICAL
