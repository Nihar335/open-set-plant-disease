- condition_id: COND-TOMATO-TARGET-SPOT
  condition_type: infectious_disease
  cause_category: fungal
  common_names:
  - Target spot
  - Corynespora leaf spot
  scientific_cause:
    name: Corynespora cassiicola
    claim:
      text: Caused by the fungus Corynespora cassiicola.
      evidence:
      - source_id: SRC-PPP-TOM-TARGETSPOT
        passage: Common Name Target spot, leaf spot Scientific Name Corynespora cassiicola
  affected_plants:
  - plant_id: PLANT-TOMATO
    claim:
      text: Hosts include tomato (also papaya, cucumber, legumes).
      evidence:
      - source_id: SRC-PPP-TOM-TARGETSPOT
        passage: Hosts Tomato, papaya
  features:
  - feature_id: FEAT-OLDER-LOWER-LEAVES-FIRST
    role: typical
    claim:
      text: Starts on older leaves and spreads upwards.
      evidence:
      - source_id: SRC-PPP-TOM-TARGETSPOT
        passage: The disease starts on the older leaves and spreads upwards.
  - feature_id: FEAT-YELLOW-HALO
    role: typical
    claim:
      text: First signs are tiny irregular spots with a yellow margin.
      evidence:
      - source_id: SRC-PPP-TOM-TARGETSPOT
        passage: irregular-shaped spots (less than 1 mm) with a yellow margin
  - feature_id: FEAT-CONCENTRIC-RINGS
    role: distinguishing
    claim:
      text: Some spots enlarge and show characteristic rings (hence 'target spot').
      evidence:
      - source_id: SRC-PPP-TOM-TARGETSPOT
        passage: Some of the spots enlarge up to 10 mm and show characteristics rings
  - feature_id: FEAT-RAPID-BLIGHT-DEFOLIATION
    role: typical
    claim:
      text: Rapid spread causes leaves to yellow, collapse and die.
      evidence:
      - source_id: SRC-PPP-TOM-TARGETSPOT
        passage: causing the leaves to turn yellow, collapse and die
  - feature_id: FEAT-STEM-LESIONS
    role: occasional
    claim:
      text: Long, thin spots can occur on stems.
      evidence:
      - source_id: SRC-PPP-TOM-TARGETSPOT
        passage: Spots also occur on the stems. They are long and thin.
  - feature_id: FEAT-FRUIT-LESIONS
    role: occasional
    claim:
      text: Small light-brown fruit spots with dark margins may occur.
      evidence:
      - source_id: SRC-PPP-TOM-TARGETSPOT
        passage: Small light brown spots with dark margins may also occur on the fruit.
  - feature_id: FEAT-LEAF-SPOTS
    role: typical
    claim:
      text: Leaf spots; the larger ones have rings inside.
      evidence:
      - source_id: SRC-PPP-TOM-TARGETSPOT
        passage: The larger spots have rings or circles inside them.
  favourable_conditions:
  - feature_id: FEAT-ENV-WARM-HUMID
    role: typical
    claim:
      text: Warm, wet conditions favour the disease.
      evidence:
      - source_id: SRC-PPP-TOM-TARGETSPOT
        passage: Warm wet conditions favour the disease
  - feature_id: FEAT-ENV-RAIN-SPLASH-WIND
    role: typical
    claim:
      text: Spores spread by wind-blown rain.
      evidence:
      - source_id: SRC-PPP-TOM-TARGETSPOT
        passage: The spores are spread by wind-blown rain
  spread_and_survival:
  - text: Inoculum comes from other crops and remains of the previous crop.
    evidence:
    - source_id: SRC-PPP-TOM-TARGETSPOT
      passage: The source of the fungus is from other crops, the remains of the previous crop
  look_alikes:
  - condition_id: COND-TOMATO-EARLY-BLIGHT
    basis: research_protocol_pairing
  diagnostic_ids:
  - DIAG-INSPECT-OLDER-LEAVES
  - DIAG-PATHOGEN-LAB-ID
  management_ids:
