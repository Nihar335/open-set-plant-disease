- condition_id: COND-TOMATO-SEPTORIA-LEAF-SPOT
  condition_type: infectious_disease
  cause_category: fungal
  common_names:
  - Septoria leaf spot
  scientific_cause:
    name: Septoria lycopersici
    claim:
      text: Caused by the fungus Septoria lycopersici.
      evidence:
      - source_id: SRC-TNAU-TOM-SEPTORIA
        passage: 'Septoria Leaf Spot: Septoria lycopersici'
  affected_plants:
  - plant_id: PLANT-TOMATO
    claim:
      text: Recorded on tomato.
      evidence:
      - source_id: SRC-TNAU-TOM-SEPTORIA
        passage: 'Vegetables:: Tomato Septoria Leaf Spot'
  features:
  - feature_id: FEAT-GREY-TAN-CENTRE-DARK-MARGIN
    role: distinguishing
    claim:
      text: Small round to irregular leaf spots with a grey centre and dark margin.
      evidence:
      - source_id: SRC-TNAU-TOM-SEPTORIA
        passage: Small, round to irregular spots with grey centre and dark margin on leaves.
  - feature_id: FEAT-RAPID-BLIGHT-DEFOLIATION
    role: typical
    claim:
      text: Spots coalesce, leaves blight and complete defoliation can follow.
      evidence:
      - source_id: SRC-TNAU-TOM-SEPTORIA
        passage: Spots coalesce and leaves are blighted. Complete defoliation.
  - feature_id: FEAT-STEM-LESIONS
    role: occasional
    claim:
      text: Stems and flowers can also be affected.
      evidence:
      - source_id: SRC-TNAU-TOM-SEPTORIA
        passage: Stems and flowers are affected.
  - feature_id: FEAT-LEAF-SPOTS
    role: typical
    claim:
      text: Small round to irregular leaf spots.
      evidence:
      - source_id: SRC-TNAU-TOM-SEPTORIA
        passage: Small, round to irregular spots with grey centre and dark margin on leaves.
  favourable_conditions:
  - feature_id: FEAT-ENV-HIGH-HUMIDITY-WET
    role: typical
    claim:
      text: Favoured by high humidity.
      evidence:
      - source_id: SRC-TNAU-TOM-SEPTORIA
        passage: Favourable conditions High humidity
  - feature_id: FEAT-ENV-RAIN-SPLASH-WIND
    role: typical
    claim:
      text: Secondary spread by conidia through rain splash or wind.
      evidence:
      - source_id: SRC-TNAU-TOM-SEPTORIA
        passage: 'Secondary spread: Conidia through rain splash or wind'
  spread_and_survival:
  - text: Survives in infected plant debris.
    evidence:
    - source_id: SRC-TNAU-TOM-SEPTORIA
      passage: 'Survival: Infected plant debris'
