# Management records. Summaries are our wording and NEVER contain doses, rates or concentrations (checked by tests).
# When the source lists a dose, dose_policy = withheld_by_policy. Chemical/biological/nutrient items are always
# consequential and carry safety notes. Nothing here is expert-reviewed yet.
x-safety-chemical: &chem
  - "Use only products currently registered for this crop in India and follow the product label for rate, interval and pre-harvest interval."
  - "Doses are deliberately omitted here; obtain them from the current label or the local KVK / state agricultural university."
  - "Wear the protective equipment required by the label and keep chemicals away from children, animals and water sources."
  - "Confirm the diagnosis before spraying; spraying for the wrong cause wastes money and can harm the crop and environment."
x-safety-nutrient: &nutr
  - "Apply nutrient corrections only after the deficiency is confirmed by a soil or tissue test; leaf colour alone is not proof."
  - "Rates are deliberately omitted; they depend on soil test, crop stage and region. Ask the local KVK / soil-testing laboratory."
  - "Unnecessary fertiliser application can damage the crop, waste money and pollute water."
x-safety-bio: &bio
  - "Use only registered, quality-assured biological products and follow the product label; doses are deliberately omitted here."
x-safety-burn: &burn
  - "Check local rules before burning crop residue; burial or other approved disposal may be required."

