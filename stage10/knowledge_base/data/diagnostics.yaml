  method_type: laboratory_test
  name: "Plant-pathology laboratory identification"
  description: "Submission of affected tissue to a plant-pathology laboratory (e.g. via a KVK or state agricultural university) for microscopy, culture or molecular identification."
  features_checked: []
  what_it_can_establish: "PENDING SOURCE — to be described from a verified Indian diagnostic-service source."
  what_it_cannot_establish: "PENDING SOURCE."
  claims: []
  curation_status: needs_source
  review_status: draft
- diagnostic_id: DIAG-WHITEFLY-CHECK
  method_type: field_observation
  name: Look for whiteflies
  description: 'Turn over young leaves and shake the plant gently: tiny white flying insects (whiteflies) carry leaf-curl virus.'
  features_checked:
  - FEAT-LEAF-CURL
  what_it_can_establish: Whether the insect that spreads leaf-curl virus is present.
  what_it_cannot_establish: Whether the plant is infected, or which virus it has; that needs a laboratory test.
  claims:
  - text: Whiteflies spread tomato leaf curl virus.
    evidence:
    - source_id: SRC-TNAU-TOM-LEAFCURL
      passage: 'Primary spread: Whiteflies.'
  curation_status: sourced
  review_status: source_verified
