# Plant records. Taxonomy from GBIF Backbone (exact passages from the cached API response). Common names and
# synonyms are editorial search aliases, not botanical claims. 'Lycopersicon esculentum' is a commonly used older name
# (editorial alias for lookup only; not asserted as a GBIF synonym).
- plant_id: PLANT-TOMATO
  common_names:
  - name: Tomato
    lang: en
    review: editorial
  scientific_name: Solanum lycopersicum L.
  taxonomy:
    kingdom: Plantae
    family: Solanaceae
    genus: Solanum
    species: Solanum lycopersicum
    status: ACCEPTED
    database_key: GBIF:2930137
    evidence:
    - source_id: SRC-GBIF-SOLANUM-LYCOPERSICUM
      passage: '"scientificName": "Solanum lycopersicum L."'
    - source_id: SRC-GBIF-SOLANUM-LYCOPERSICUM
      passage: '"status": "ACCEPTED"'
    - source_id: SRC-GBIF-SOLANUM-LYCOPERSICUM
      passage: '"family": "Solanaceae"'
    - source_id: SRC-GBIF-SOLANUM-LYCOPERSICUM
      passage: '"genus": "Solanum"'
    - source_id: SRC-GBIF-SOLANUM-LYCOPERSICUM
      passage: '"kingdom": "Plantae"'
  synonyms:
  - tomato
  - Solanum lycopersicum
  - Lycopersicon esculentum
  crop_categories:
  - vegetable
  frozen_model_scope: true
  frozen_model_crop_label: Tomato
  review_status: source_verified
