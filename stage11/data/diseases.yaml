  look_alikes: [apple_alternaria_leaf_spot, apple_black_rot]
  management: Remove fallen leaves, improve air flow; usually controlled by the routine orchard spray programme.
- key: apple_powdery_mildew
  crop: apple
  name: Powdery mildew
  model_class: AppleLeaf9 Powdery mildew
  extra: [AppleLeaf9 Powdery mildew]
  plantdoc: []
  pathogen: Podosphaera leucotricha
  pathogen_type: fungus
  symptoms: {white_powdery_coating: 1.0, leaf_curling: 0.6, leaf_distortion: 0.6}
  weather: {temp: [10, 25], humidity: moderate, rain: dry}
  tests: [rub_test_powdery, hand_lens_spores]
  look_alikes: []
  management: Prune out white (infected) shoots and buds in winter and spring, keep the canopy open.
- key: apple_mosaic
  crop: apple
  name: Apple mosaic
  model_class: AppleLeaf9 Mosaic + Kashmir Apple_Mosaic
  extra: [AppleLeaf9 Mosaic, Kashmir Apple_Mosaic]
  plantdoc: []
  pathogen: Apple mosaic virus (ApMV; spread by grafting with infected budwood)
  pathogen_type: virus
  symptoms: {mosaic_mottling: 1.0, vein_yellowing: 0.6, general_yellowing: 0.3}
  weather: {temp: [15, 30], humidity: any, rain: any}
  tests: [elisa_virus, pcr_virus]
  look_alikes: []
  management: No cure. Use certified virus-free rootstocks and budwood; keep tree vigour with balanced nutrition.
- key: apple_healthy
  crop: apple
  name: Healthy
  model_class: Apple___healthy
  plantdoc: [Apple leaf]
  pathogen: null
  pathogen_type: none
  symptoms: {no_visible_symptoms: 1.0}
  weather: null
  tests: []
  look_alikes: []
  management: No disease detected. Keep monitoring weekly.

