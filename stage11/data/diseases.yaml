# Stage 11 disease database.
#
# Two kinds of entries:
#   * image-trained: model_class is set -> the CNN was trained on photos of this class (PlantVillage folder name),
#     plantdoc lists the PlantDoc field-photo folders mapped onto it.
#   * database-only: model_class is null -> no training photos. These are reached only through
#     symptom matching (symptom head output vs the symptom profile below) and are never reported at
#     >= 85% confidence.
#
# symptoms: symptom-id -> weight (1.0 hallmark, 0.6 common, 0.3 sometimes). Ids come from symptoms.yaml.
#   The profiles of image-trained classes are also the weak labels for the symptom head during training.
# weather: favourable conditions. temp = optimum air temperature range in deg C; humidity = high (>80% RH),
#   moderate (60-80%), low (<60%), any; rain = wet (rain / leaf wetness favours it), dry (dry weather favours it), any.
# tests: ids from diagnostic_tests.yaml, in the recommended order.
# Provenance: curated from standard plant-pathology references (APS disease compendia, university extension
#   factsheets, TNAU Agritech portal). Curated by the project team; NOT expert-reviewed.
# Management notes are cultural practices only. Chemical products and doses are deliberately omitted: ask the
#   local KVK / agriculture officer for products registered in India (CIBRC).

# ---------------------------------------------------------------- Apple
- key: apple_scab
  crop: apple
  name: Apple scab
  model_class: Apple___Apple_scab
  plantdoc: [Apple Scab Leaf]
  pathogen: Venturia inaequalis
  pathogen_type: fungus
  symptoms: {olive_velvety_lesions: 1.0, dark_black_spots: 0.6, leaf_distortion: 0.3, general_yellowing: 0.3}
  weather: {temp: [13, 24], humidity: high, rain: wet}
  tests: [hand_lens_spores, moist_chamber, spore_microscopy]
  look_alikes: [apple_black_rot]
  management: Rake and destroy fallen leaves, prune for air flow, plant scab-resistant varieties.
- key: apple_black_rot
  crop: apple
  name: Black rot (frog-eye leaf spot)
  model_class: Apple___Black_rot
  extra: [AppleLeaf9 Frogeye leaf spot]
  plantdoc: []
  pathogen: Botryosphaeria obtusa (syn. Diplodia seriata)
  pathogen_type: fungus
  symptoms: {brown_spots: 1.0, purple_red_margins: 1.0, concentric_rings: 0.6, many_small_spots: 0.3, general_yellowing: 0.3}
  weather: {temp: [20, 30], humidity: high, rain: wet}
  tests: [hand_lens_spores, moist_chamber, culture_isolation]
  look_alikes: [apple_alternaria_leaf_spot, apple_cedar_rust, apple_scab]
  management: Remove mummified fruit and dead wood / cankers, prune infected branches.
- key: apple_cedar_rust
