  look_alikes: [apple_alternaria_leaf_spot, apple_scab]
  management: Collect and destroy fallen leaves in autumn, prune for air flow, avoid prolonged leaf wetness; it causes early leaf fall in rainy summers.
- key: apple_grey_spot
  crop: apple
