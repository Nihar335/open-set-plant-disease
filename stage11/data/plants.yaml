# Stage 11 botanical-name dataset: common / local names -> accepted scientific (biological) name and family.
# model_crop: the crop key used by the disease model (diseases.yaml `crop`); null = no training photos for this plant,
#   the app then relies on symptom detection + database-only diseases.
# aliases: English synonyms and common Hindi / Indian-language names (transliterated); used for name matching.
# Scientific names follow the accepted names in Plants of the World Online / GBIF backbone (curated, not
#   verified record-by-record).
